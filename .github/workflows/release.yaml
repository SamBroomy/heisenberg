name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build but do not publish)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # =============================================================================
  # Build Python Wheels for all platforms
  # =============================================================================
  build-wheels:
    name: Build wheels (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux runners
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            manylinux: manylinux_2_28
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            manylinux: manylinux_2_28
          # Windows runners
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: null
          # macOS runners
          - runner: macos-14
            target: aarch64-apple-darwin
            manylinux: null
    steps:
      - uses: actions/checkout@v4
      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.8.2
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: true
          manylinux: ${{ matrix.platform.manylinux }}
          working-directory: python/heisenberg-geo
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}
          path: python/heisenberg-geo/dist

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.8.2
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: python/heisenberg-geo
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/heisenberg-geo/dist

  # =============================================================================
  # Publish to PyPI (only on tags, not dry run)
  # =============================================================================
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    needs: [build-wheels, build-sdist]
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist
      - name: List artifacts
        run: |
          echo "=== Artifacts to publish ==="
          ls -la dist/
          echo ""
          echo "Total: $(ls dist/ | wc -l) files"
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish
        working-directory: .
