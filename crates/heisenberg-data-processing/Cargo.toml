[package]
name = "heisenberg-data-processing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Data processing pipeline for Heisenberg location enrichment library. Includes data downloading, extraction, transformation, and loading the raw data into a queryable format that gets embedded into the Heisenberg library."
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
polars = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Additional dependencies for data processing
itertools = { workspace = true }
zip = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
directories = { workspace = true, optional = true }

[dev-dependencies]
num-traits = { workspace = true }

[features]
default = ["download-data", "directories"]
system-dirs = ["directories"]
download-data = ["reqwest", "tokio", "indicatif", "futures"]
test-data = []

[lints]
workspace = true
